<main class="main-content">
    <section class="introduction">

        <form id="contactForm">

            <label for="name">Name</label>
            <input type="text"
                   id="name"
                   name="name"
                   required>

            <br><br>

            <label for="email">Email</label>
            <input type="email"
                   id="email"
                   name="email"
                   required>

            <br><br>

            <label for="message">Message</label>

            <textarea id="message"
                      name="message"
                      required></textarea>

            <br><br>

            <button type="submit">
                Submit
            </button>

        </form>

        <br>

        <div id="map" style="height:400px;"></div>

    </section>
</main>
